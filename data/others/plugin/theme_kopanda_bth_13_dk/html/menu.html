<div id="menu_menu_wrapper">
	<div class="display_menu block_menu anim_bounce" align="center">

		<div>
				<div class="menu_item menu_save">
				<a href="javascript:void(0)"><img src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_btn_save.png" /></a>
				</div>

				<div class="menu_item menu_load">
				<a href="javascript:void(0)"><img src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_btn_load.png" /></a>
				</div>

				<div class="menu_item menu_config">
				<a href="javascript:void(0)" onclick="myobj.config();">
				<img src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_btn_config.png" />
				</a>
				</div>

				<div class="menu_item menu_back_title">
				<a href="javascript:void(0)"><img src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_btn_title.png" /></a>
				</div>

				<div class='menu_item menu_close'>
				<a href="javascript:void(0)"><img src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_btn_close.png" /></a>
				</div>

			</div>
		</div>

		<!-- 背景画像 -->
		<img src='data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_bg.png' style='z-index:-1; left:0; top:0; width:100%; height:100%; position:absolute;'>
		<img class="img_label img_label_menu block_menu anim_bounce" src="data/others/plugin/theme_kopanda_bth_13_dk/image/system/menu_bg_panel.png" style='position:absolute; left:640px; top:120px; width:640px; height:840px;'/>

		<!-- ボタンホバー時に画像を変更する -->
    <script>
        $("#menu_menu_wrapper .menu_item img").each((i, elm) => {
            const j_elm = $(elm);
            const original_src = j_elm.attr("src");
            const hover_src = original_src.replace(".png", "2.png");
            j_elm.hover(
                () => {
                    j_elm.attr("src", hover_src);
                },
                () => {
                    j_elm.attr("src", original_src);
                },
            );
        });
    </script>

</div>
